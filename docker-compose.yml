services:
  api_gateway:
    build: ./API-Gateway
    # use python rather than gunicorn for local dev
    command: python ./API-Gateway/app.py
    volumes:
     - ./api_gateway:/app
    ports:
      - "5001:80"
    networks:
      - claas_net

